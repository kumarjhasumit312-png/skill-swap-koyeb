{% extends "base.html" %}

{% block title %}Register - SkillSwap{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto;">
    <div class="card">
        <h2 style="text-align: center; color: #667eea; margin-bottom: 1.5rem;">
            Create Account
        </h2>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Choose a password" minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Register
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 1rem;">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" style="color: #667eea;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
